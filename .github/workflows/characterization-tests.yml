name: Characterization Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_VERSION: 7.0.14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - run: npm ci
      - run: npm test
